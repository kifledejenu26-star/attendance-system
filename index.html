<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ማህበረ ቅዱሳን - የአባላት መቆጣጠሪያ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Firebase Realtime Database Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        .bg-mk {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f766e 100%);
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-gray-800 min-h-screen">

    <!-- LOGIN SECTION -->
    <div id="loginSection" class="fixed inset-0 bg-mk z-50 flex items-center justify-center p-4">
        <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-6 md:p-8 w-full max-w-md border border-white/20">
            <div class="text-center mb-6">
                <!-- Mahibere Kidusan Logo -->
                <img src="https://mk.org.et/wp-content/uploads/2021/04/cropped-mk-logo.png" alt="ማህበረ ቅዱሳን ሎጎ" class="h-20 mx-auto mb-2 object-contain drop-shadow-md" onerror="this.src='https://via.placeholder.com/80?text=MK+Logo'">
                <h2 class="text-2xl font-bold text-slate-800">ማህበረ ቅዱሳን</h2>
                <p class="text-xs text-amber-700 font-semibold mt-1">የአባላት መከታተያ ሲስተም</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">የተጠቃሚ ስም (Username)</label>
                    <input type="text" id="loginUsername" required class="w-full border border-slate-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">ይለፍ ቃል (Password)</label>
                    <input type="password" id="loginPassword" required class="w-full border border-slate-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <p id="loginError" class="text-rose-500 text-xs hidden font-medium text-center">የተጠቃሚ ስም ወይም ይለፍ ቃል ተሳስቷል!</p>
                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-xl shadow-lg transition duration-200">
                    ወደ ሲስተሙ ግባ / Login
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP SECTION -->
    <div id="appSection" class="hidden">
        <!-- Mobile Top Header -->
        <div class="bg-slate-900 text-white p-4 flex justify-between items-center shadow-md md:hidden">
            <div class="flex items-center gap-2">
                <img src="https://mk.org.et/wp-content/uploads/2021/04/cropped-mk-logo.png" class="h-8 w-8 rounded-full bg-white p-0.5" alt="Logo">
                <h1 class="font-bold text-sm">ማህበረ ቅዱሳን</h1>
            </div>
            <div class="flex items-center gap-2">
                <span id="mobileRoleBadge" class="text-[10px] px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 font-medium">አድሚን</span>
                <button onclick="logout()" class="text-xs bg-rose-600 px-2 py-1 rounded text-white">ውጣ</button>
            </div>
        </div>

        <div class="flex flex-col md:flex-row h-screen overflow-hidden">
            <!-- Sidebar for Desktop -->
            <div class="hidden md:flex w-64 bg-slate-900 text-white flex-col justify-between p-5 shadow-xl">
                <div>
                    <div class="flex items-center gap-3 mb-8 border-b border-slate-800 pb-4">
                        <img src="https://mk.org.et/wp-content/uploads/2021/04/cropped-mk-logo.png" class="h-12 w-12 rounded-xl bg-white p-1 object-contain" alt="Logo">
                        <div>
                            <h1 class="text-base font-bold">ማህበረ ቅዱሳን</h1>
                            <span id="userRoleBadge" class="text-xs px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 font-medium">⭐ ዋና አድሚን</span>
                        </div>
                    </div>
                    <nav class="space-y-2">
                        <button onclick="setActiveTab('all')" id="tab-all" class="w-full text-left px-4 py-3 bg-amber-600 text-white rounded-xl font-medium shadow-md">
                            📊 ሁሉም አባላት
                        </button>
                        <div class="pt-4 text-xs font-semibold text-slate-400 uppercase">የክፍሎች ዝርዝር</div>
                        <div id="deptButtons" class="space-y-1 max-h-60 overflow-y-auto pr-1"></div>
                    </nav>
                </div>
                <button onclick="logout()" class="w-full bg-rose-600 hover:bg-rose-700 text-white py-2.5 rounded-xl font-medium text-sm flex items-center justify-center gap-2 transition">
                    🚪 ውጣ (Logout)
                </button>
            </div>

            <!-- Main Content -->
            <div class="flex-1 overflow-y-auto p-4 md:p-8">
                <!-- Header Controls -->
                <div class="flex flex-col gap-3 mb-6">
                    <div>
                        <h2 id="pageTitle" class="text-xl md:text-2xl font-bold text-slate-800">የአባላት መከታተያ ዳሽቦርድ</h2>
                        <p class="text-gray-500 text-xs md:text-sm">የአባላት ምደባ እና ሁኔታ መከታተያ</p>
                    </div>
                    
                    <!-- Action Buttons -->
                    <div class="flex flex-wrap gap-2">
                        <!-- Allowed for BOTH Admin & Callers -->
                        <button onclick="openAddModal()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2.5 rounded-xl font-medium shadow-sm text-xs md:text-sm flex items-center gap-2">
                            ➕ አባል መዝግብ
                        </button>
                        <button onclick="exportToExcel()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2.5 rounded-xl font-medium shadow-sm text-xs md:text-sm flex items-center gap-2">
                            📥 Excel አውርድ
                        </button>

                        <!-- ADMIN ONLY BUTTONS -->
                        <button id="createUserBtn" onclick="openUserManagementModal()" class="admin-only bg-purple-600 hover:bg-purple-700 text-white px-4 py-2.5 rounded-xl font-medium shadow-sm text-xs md:text-sm flex items-center gap-2">
                            🔑 ተጠቃሚዎችን አስተዳድር (Users)
                        </button>
                        <input type="file" id="excelFile" accept=".xlsx, .xls" class="hidden" onchange="handleFile(event)">
                        <button id="uploadBtn" onclick="document.getElementById('excelFile').click()" class="admin-only bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl font-medium shadow-sm text-xs md:text-sm flex items-center gap-2">
                            📁 Excel ጫን
                        </button>
                        <button onclick="clearAllMembers()" class="admin-only bg-rose-600 hover:bg-rose-700 text-white px-4 py-2.5 rounded-xl font-medium shadow-sm text-xs md:text-sm flex items-center gap-2">
                            🗑️ ሁሉንም አባላት አጽዳ
                        </button>
                    </div>
                </div>

                <!-- Summary Cards -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                    <div class="bg-white p-3 md:p-5 rounded-2xl shadow-sm border border-slate-200">
                        <p class="text-gray-500 text-xs font-medium">ጠቅላላ</p>
                        <h3 id="totalCount" class="text-xl md:text-3xl font-bold text-slate-800 mt-1">0</h3>
                    </div>
                    <div class="bg-white p-3 md:p-5 rounded-2xl shadow-sm border border-slate-200">
                        <p class="text-gray-500 text-xs font-medium">የጀመሩ</p>
                        <h3 id="startedCount" class="text-xl md:text-3xl font-bold text-emerald-600 mt-1">0</h3>
                    </div>
                    <div class="bg-white p-3 md:p-5 rounded-2xl shadow-sm border border-slate-200">
                        <p class="text-gray-500 text-xs font-medium">ያልጀመሩ</p>
                        <h3 id="notStartedCount" class="text-xl md:text-3xl font-bold text-rose-500 mt-1">0</h3>
                    </div>
                    <div class="bg-white p-3 md:p-5 rounded-2xl shadow-sm border border-slate-200">
                        <p class="text-gray-500 text-xs font-medium">ፎርም የሞሉ</p>
                        <h3 id="formCount" class="text-xl md:text-3xl font-bold text-blue-600 mt-1">0</h3>
                    </div>
                </div>

                <!-- Search Bar -->
                <div class="mb-4">
                    <input type="text" id="searchInput" oninput="filterData()" placeholder="🔍 በስም ወይም በስልክ ቁጥር ፈልግ..." class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm bg-white">
                </div>

                <!-- Cards View -->
                <div id="membersContainer" class="space-y-3">
                    <div class="text-center py-8 text-gray-400">መረጃ በመጫን ላይ ነው...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Form for Member (Add/Edit) -->
    <div id="memberModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-end md:items-center justify-center p-0 md:p-4 z-50">
        <div class="bg-white rounded-t-2xl md:rounded-2xl shadow-2xl max-w-lg w-full p-5 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-800">አዲስ አባል መመዝገቢያ</h3>
                <button onclick="closeModal()" class="text-gray-400 text-2xl font-bold">&times;</button>
            </div>
            <form id="memberForm" onsubmit="saveMember(event)" class="space-y-3">
                <input type="hidden" id="memberId">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">ሙሉ ስም</label>
                    <input type="text" id="inputName" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">ስልክ ቁጥር</label>
                        <input type="tel" id="inputPhone" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">ክፍል</label>
                        <input type="text" id="inputDept" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">ሁኔታ</label>
                        <select id="inputStatus" class="w-full border rounded-lg px-3 py-2 text-sm">
                            <option value="ጀምረዋል">ጀምረዋል</option>
                            <option value="አልጀመሩም">አልጀመሩም</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">ቋሚ ፎርም</label>
                        <select id="inputForm" class="w-full border rounded-lg px-3 py-2 text-sm">
                            <option value="ሞልተዋል">ሞልተዋል</option>
                            <option value="አልሞሉም">አልሞሉም</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">ደዋይ / አስተባባሪ</label>
                    <input type="text" id="inputCaller" class="w-full border rounded-lg px-3 py-2 text-sm">
                </div>

                <div class="flex justify-end gap-2 border-t pt-4 mt-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-2.5 border rounded-xl text-sm font-medium">ሰርዝ</button>
                    <button type="submit" class="px-5 py-2.5 bg-amber-600 text-white rounded-xl text-sm font-medium shadow-md">አስቀምጥ</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for Managing Users (Admin Only) -->
    <div id="userManagementModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="text-lg font-bold text-slate-800">🔑 የተጠቃሚዎች መቆጣጠሪያ</h3>
                <button onclick="closeUserManagementModal()" class="text-gray-400 text-2xl font-bold">&times;</button>
            </div>
            
            <!-- Create/Edit Form -->
            <form onsubmit="saveUserAccount(event)" class="space-y-3 bg-purple-50 p-4 rounded-xl mb-4 border border-purple-100">
                <h4 id="userFormTitle" class="text-xs font-bold text-purple-800 uppercase">አዲስ ተጠቃሚ/ደዋይ ፍጠር</h4>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-600">Username</label>
                        <input type="text" id="newUsername" required class="w-full border rounded-lg px-3 py-1.5 text-xs bg-white">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-600">Password</label>
                        <input type="text" id="newPassword" required class="w-full border rounded-lg px-3 py-1.5 text-xs bg-white">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-600">የስራ ድርሻ (Role)</label>
                    <select id="newUserRole" class="w-full border rounded-lg px-2 py-1.5 text-xs bg-white">
                        <option value="caller">ደዋይ (መመዝገብ፣ ማየትና መደወል ብቻ)</option>
                        <option value="admin">አድሚን (ሙሉ ስልጣን ያለው)</option>
                    </select>
                </div>
                <button type="submit" class="w-full py-2 bg-purple-600 text-white rounded-lg text-xs font-bold shadow-md">
                    አስቀምጥ / Save User
                </button>
            </form>

            <!-- Existing Users List -->
            <h4 class="text-xs font-bold text-slate-600 mb-2">የተመዘገቡ ተጠቃሚዎች ዝርዝር፦</h4>
            <div id="usersListContainer" class="space-y-2 max-h-48 overflow-y-auto"></div>
        </div>
    </div>

    <script>
        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyAUC7UbNJoxzKdD2nB8j4ptl_PfAAGn3w4",
            authDomain: "attendance-app-edbbb.firebaseapp.com",
            databaseURL: "https://attendance-app-edbbb-default-rtdb.firebaseio.com",
            projectId: "attendance-app-edbbb",
            storageBucket: "attendance-app-edbbb.firebasestorage.app",
            messagingSenderId: "594751308584",
            appId: "1:594751308584:web:215994b22038c8b137061d",
            measurementId: "G-1LKVTZ60VP"
        };

        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();

        let membersData = [];
        let currentFilterDept = 'all';
        let currentUserRole = null; // 'admin' or 'caller'

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value.trim();
            const errorMsg = document.getElementById('loginError');

            if (u === 'admin' && p === 'admin123') {
                currentUserRole = 'admin';
                localStorage.setItem('userRole', 'admin');
                startApp();
                return;
            }

            const snapshot = await rtdb.ref('users/' + u).once('value');
            const userData = snapshot.val();

            if (userData && userData.password === p) {
                currentUserRole = userData.role || 'caller';
                localStorage.setItem('userRole', currentUserRole);
                startApp();
            } else {
                errorMsg.classList.remove('hidden');
            }
        }

        function checkSession() {
            const savedRole = localStorage.getItem('userRole');
            if (savedRole) {
                currentUserRole = savedRole;
                startApp();
            }
        }

        function logout() {
            localStorage.removeItem('userRole');
            location.reload();
        }

        function startApp() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');

            const isA = currentUserRole === 'admin';
            document.getElementById('userRoleBadge').innerText = isA ? "⭐ ዋና አድሚን" : "📞 ደዋይ / ተጠቃሚ";
            document.getElementById('mobileRoleBadge').innerText = isA ? "አድሚን" : "ደዋይ";

            document.querySelectorAll('.admin-only').forEach(el => {
                if(!isA) el.classList.add('hidden');
            });

            listenToRealtimeUpdates();
        }

        window.onload = checkSession;

        function listenToRealtimeUpdates() {
            rtdb.ref('members').on('value', (snapshot) => {
                membersData = [];
                const data = snapshot.val();
                if(data) {
                    Object.keys(data).forEach(key => {
                        membersData.push({ id: key, ...data[key] });
                    });
                }
                renderDepartmentButtons();
                filterData();
            });
        }

        function filterData() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = membersData.filter(item => {
                const matchesDept = currentFilterDept === 'all' || item.dept === currentFilterDept;
                const matchesSearch = (item.name || '').toLowerCase().includes(search) || (item.phone || '').includes(search);
                return matchesDept && matchesSearch;
            });
            renderCards(filtered);
            updateMetrics(filtered);
        }

        function renderCards(data) {
            const container = document.getElementById('membersContainer');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-xl text-center text-gray-400 font-medium">ምንም አባል አልተገኘም።</div>`;
                return;
            }

            const isAdmin = currentUserRole === 'admin';

            data.forEach((item) => {
                const isStarted = item.status && item.status.includes('ጀምረዋል');
                const statusBadge = isStarted
                    ? `<span class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full text-xs font-semibold">ጀምረዋል</span>`
                    : `<span class="bg-rose-100 text-rose-700 px-2 py-0.5 rounded-full text-xs font-semibold">አልጀመሩም</span>`;

                const editDeleteBtns = isAdmin 
                    ? `<button onclick="openEditModal('${item.id}')" class="text-blue-600 font-bold text-xs bg-blue-50 px-2.5 py-1.5 rounded-lg">✏️ ኤዲት</button>
                       <button onclick="deleteMember('${item.id}')" class="text-rose-600 font-bold text-xs bg-rose-50 px-2.5 py-1.5 rounded-lg">🗑️</button>`
                    : '';

                container.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                <h4 class="font-bold text-slate-800 text-base">${item.name}</h4>
                                ${statusBadge}
                            </div>
                            <p class="text-xs text-gray-500">ክፍል፦ ${item.dept || '-'} | ቋሚ ፎርም፦ ${item.form || '-'}</p>
                            <p class="text-xs text-gray-400">ደዋይ፦ ${item.caller || '-'}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <a href="tel:${item.phone}" class="bg-emerald-50 text-emerald-600 p-2.5 rounded-xl font-bold text-sm flex items-center gap-1">
                                📞 ደውል
                            </a>
                            ${editDeleteBtns}
                        </div>
                    </div>
                `;
            });
        }

        function updateMetrics(data) {
            document.getElementById('totalCount').innerText = data.length;
            document.getElementById('startedCount').innerText = data.filter(d => d.status && d.status.includes('ጀምረዋል')).length;
            document.getElementById('notStartedCount').innerText = data.filter(d => !d.status || d.status.includes('አልጀመሩም')).length;
            document.getElementById('formCount').innerText = data.filter(d => d.form && d.form.includes('ሞልተዋል')).length;
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerText = "አዲስ አባል መመዝገቢያ";
            document.getElementById('memberForm').reset();
            document.getElementById('memberId').value = "";
            document.getElementById('memberModal').classList.remove('hidden');
        }

        function openEditModal(id) {
            if(currentUserRole !== 'admin') return;
            const member = membersData.find(m => m.id === id);
            if(!member) return;

            document.getElementById('modalTitle').innerText = "የአባል መረጃ ኤዲት ማድረጊያ";
            document.getElementById('memberId').value = member.id;
            document.getElementById('inputName').value = member.name || '';
            document.getElementById('inputPhone').value = member.phone || '';
            document.getElementById('inputDept').value = member.dept || '';
            document.getElementById('inputStatus').value = member.status || 'ጀምረዋል';
            document.getElementById('inputForm').value = member.form || 'ሞልተዋል';
            document.getElementById('inputCaller').value = member.caller || '';
            document.getElementById('memberModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('memberModal').classList.add('hidden');
        }

        async function saveMember(e) {
            e.preventDefault();
            const id = document.getElementById('memberId').value;

            const data = {
                name: document.getElementById('inputName').value,
                phone: document.getElementById('inputPhone').value,
                dept: document.getElementById('inputDept').value,
                status: document.getElementById('inputStatus').value,
                form: document.getElementById('inputForm').value,
                caller: document.getElementById('inputCaller').value
            };

            if(id) {
                if(currentUserRole !== 'admin') return;
                await rtdb.ref('members/' + id).update(data);
            } else {
                await rtdb.ref('members').push(data);
            }

            closeModal();
        }

        async function deleteMember(id) {
            if(currentUserRole !== 'admin') return;
            if(confirm("ይህንን አባል በርግጥ ለማጥፋት ይፈልጋሉ?")) {
                await rtdb.ref('members/' + id).remove();
            }
        }

        async function clearAllMembers() {
            if(currentUserRole !== 'admin') return;
            if(confirm("⚠️ ማስጠንቀቂያ፦ ሁሉንም የአባላት መረጃዎች ለማጥፋት እርግጠኛ ነዎት? ይህ ድርጊት አይመለስም!")) {
                await rtdb.ref('members').remove();
                alert("ሁሉም መረጃዎች ጸድተዋል!");
            }
        }

        // USER MANAGEMENT (ADMIN ONLY)
        function openUserManagementModal() {
            if(currentUserRole !== 'admin') return;
            document.getElementById('newUsername').value = "";
            document.getElementById('newPassword').value = "";
            loadUsersList();
            document.getElementById('userManagementModal').classList.remove('hidden');
        }

        function closeUserManagementModal() {
            document.getElementById('userManagementModal').classList.add('hidden');
        }

        async function loadUsersList() {
            const container = document.getElementById('usersListContainer');
            container.innerHTML = 'በመጫን ላይ...';
            const snapshot = await rtdb.ref('users').once('value');
            const users = snapshot.val() || {};
            
            container.innerHTML = '';
            Object.keys(users).forEach(uname => {
                const u = users[uname];
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-100 p-2 rounded-lg text-xs">
                        <div>
                            <span class="font-bold text-slate-800">${uname}</span>
                            <span class="text-gray-500"> (Pass: ${u.password}) - <b class="text-purple-600">${u.role}</b></span>
                        </div>
                        <div class="flex gap-1">
                            <button onclick="fillUserEdit('${uname}', '${u.password}', '${u.role}')" class="text-blue-600 font-bold px-1.5 py-0.5 bg-blue-50 rounded">✏️</button>
                            <button onclick="deleteUserAccount('${uname}')" class="text-rose-600 font-bold px-1.5 py-0.5 bg-rose-50 rounded">🗑️</button>
                        </div>
                    </div>
                `;
            });
        }

        function fillUserEdit(u, p, r) {
            document.getElementById('newUsername').value = u;
            document.getElementById('newPassword').value = p;
            document.getElementById('newUserRole').value = r;
        }

        async function saveUserAccount(e) {
            e.preventDefault();
            if(currentUserRole !== 'admin') return;

            const u = document.getElementById('newUsername').value.trim();
            const p = document.getElementById('newPassword').value.trim();
            const role = document.getElementById('newUserRole').value;

            if(!u || !p) return;

            await rtdb.ref('users/' + u).set({ password: p, role: role });
            alert(`ተጠቃሚ "${u}" ተመዝግቧል/ተስተካክሏል!`);
            document.getElementById('newUsername').value = "";
            document.getElementById('newPassword').value = "";
            loadUsersList();
        }

        async function deleteUserAccount(uname) {
            if(currentUserRole !== 'admin') return;
            if(confirm(`ተጠቃሚ "${uname}" እንዲጠፋ ይፈልጋሉ?`)) {
                await rtdb.ref('users/' + uname).remove();
                loadUsersList();
            }
        }

        function handleFile(e) {
            if(currentUserRole !== 'admin') return;
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(event) {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                
                batchUploadToFirebase(jsonData);
            };
            reader.readAsArrayBuffer(file);
        }

        function batchUploadToFirebase(data) {
            const updates = {};
            data.forEach(row => {
                const newKey = rtdb.ref().child('members').push().key;

                let rawStatus = String(row['ሁኔታ'] || row['Status'] || '').trim();
                let parsedStatus = "አልጀመሩም";
                if(rawStatus.includes('ጀምረዋል') || rawStatus.toLowerCase() === 'started' || rawStatus === '1') {
                    parsedStatus = "ጀምረዋል";
                }

                let rawForm = String(row['ፎርም'] || row['Form'] || '').trim();
                let parsedForm = "አልሞሉም";
                if(rawForm.includes('ሞልተዋል') || rawForm.toLowerCase() === 'filled' || rawForm === '1') {
                    parsedForm = "ሞልተዋል";
                }

                updates['/members/' + newKey] = {
                    name: row['ስም'] || row['Name'] || '',
                    phone: String(row['ስልክ'] || row['Phone'] || ''),
                    dept: row['ክፍል'] || row['Department'] || 'ያልተመደበ',
                    status: parsedStatus,
                    form: parsedForm,
                    caller: row['ደዋይ'] || row['Caller'] || ''
                };
            });

            rtdb.ref().update(updates).then(() => {
                alert("የኤክሴል መረጃው በስኬት ተጭኗል!");
            });
        }

        function exportToExcel() {
            if(membersData.length === 0) {
                alert("የሚወርድ መረጃ የለም!");
                return;
            }

            const exportFormat = membersData.map((m, index) => ({
                "ተ.ቁ": index + 1,
                "ስም": m.name || '',
                "ስልክ": m.phone || '',
                "ክፍል": m.dept || '',
                "ሁኔታ": m.status || '',
                "ቋሚ ፎርም": m.form || '',
                "ደዋይ": m.caller || ''
            }));

            const worksheet = XLSX.utils.json_to_sheet(exportFormat);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "የአባላት ዝርዝር");
            XLSX.writeFile(workbook, "የአባላት_ዝርዝር.xlsx");
        }

        function renderDepartmentButtons() {
            const depts = [...new Set(membersData.map(m => m.dept).filter(Boolean))];
            const container = document.getElementById('deptButtons');
            container.innerHTML = '';
            depts.forEach(d => {
                container.innerHTML += `
                    <button onclick="setActiveTab('${d}')" class="w-full text-left px-3 py-2 hover:bg-slate-800 rounded-lg text-sm text-slate-300">
                        ${d} (${membersData.filter(m=>m.dept===d).length})
                    </button>
                `;
            });
        }

        function setActiveTab(dept) {
            currentFilterDept = dept;
            filterData();
        }
    </script>
</body>
</html>
