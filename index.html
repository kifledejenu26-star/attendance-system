<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>የአባላት መቆጣጠሪያ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Firebase Realtime Database Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-100 font-sans text-gray-800 pb-20 md:pb-0">

    <!-- Mobile Top Header -->
    <div class="bg-slate-900 text-white p-4 flex justify-between items-center shadow-md md:hidden">
        <h1 class="font-bold text-lg">👥 የአባላት ሲስተም</h1>
        <span id="mobileRoleBadge" class="text-xs px-2 py-1 rounded bg-blue-500/20 text-blue-300 font-medium">አድሚን</span>
    </div>

    <div class="flex flex-col md:flex-row h-screen overflow-hidden">
        <!-- Sidebar for Desktop -->
        <div class="hidden md:flex w-64 bg-slate-900 text-white flex-col justify-between p-5 shadow-xl">
            <div>
                <div class="flex items-center gap-3 mb-8">
                    <div class="p-2 bg-blue-600 rounded-lg text-white font-bold text-xl">👥</div>
                    <div>
                        <h1 class="text-lg font-bold">የአባላት ሲስተም</h1>
                        <span id="userRoleBadge" class="text-xs px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 font-medium">አድሚን</span>
                    </div>
                </div>
                <nav class="space-y-2">
                    <button onclick="setActiveTab('all')" id="tab-all" class="w-full text-left px-4 py-3 bg-blue-600 rounded-lg font-medium shadow-md">
                        📊 ሁሉም አባላት
                    </button>
                    <div class="pt-4 text-xs font-semibold text-slate-400 uppercase">የክፍሎች ዝርዝር</div>
                    <div id="deptButtons" class="space-y-1 max-h-80 overflow-y-auto pr-1"></div>
                </nav>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 overflow-y-auto p-4 md:p-8">
            <!-- Header Controls -->
            <div class="flex flex-col gap-3 mb-6">
                <div>
                    <h2 id="pageTitle" class="text-xl md:text-2xl font-bold text-gray-800">የአባላት መከታተያ ዳሽቦርድ</h2>
                    <p class="text-gray-500 text-xs md:text-sm">የአባላት ምደባ እና ሁኔታ መከታተያ</p>
                </div>
                
                <!-- Action Buttons -->
                <div class="grid grid-cols-2 md:flex gap-2">
                    <button id="addBtn" onclick="openAddModal()" class="bg-blue-600 active:bg-blue-700 text-white p-3 md:px-4 md:py-2.5 rounded-xl font-medium shadow-sm text-xs md:text-sm flex items-center justify-center gap-2">
                        ➕ አባል መዝግብ
                    </button>
                    <input type="file" id="excelFile" accept=".xlsx, .xls" class="hidden" onchange="handleFile(event)">
                    <button id="uploadBtn" onclick="document.getElementById('excelFile').click()" class="bg-emerald-600 active:bg-emerald-700 text-white p-3 md:px-4 md:py-2.5 rounded-xl font-medium shadow-sm text-xs md:text-sm flex items-center justify-center gap-2">
                        📁 Excel ጫን
                    </button>
                </div>
            </div>

            <!-- Summary Cards -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                <div class="bg-white p-3 md:p-5 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-gray-500 text-xs font-medium">ጠቅላላ</p>
                    <h3 id="totalCount" class="text-xl md:text-3xl font-bold text-slate-800 mt-1">0</h3>
                </div>
                <div class="bg-white p-3 md:p-5 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-gray-500 text-xs font-medium">የጀመሩ</p>
                    <h3 id="startedCount" class="text-xl md:text-3xl font-bold text-emerald-600 mt-1">0</h3>
                </div>
                <div class="bg-white p-3 md:p-5 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-gray-500 text-xs font-medium">ያልጀመሩ</p>
                    <h3 id="notStartedCount" class="text-xl md:text-3xl font-bold text-rose-500 mt-1">0</h3>
                </div>
                <div class="bg-white p-3 md:p-5 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-gray-500 text-xs font-medium">ፎርም የሞሉ</p>
                    <h3 id="formCount" class="text-xl md:text-3xl font-bold text-blue-600 mt-1">0</h3>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="mb-4">
                <input type="text" id="searchInput" oninput="filterData()" placeholder="🔍 በስም ወይም በስልክ ቁጥር ፈልግ..." class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <!-- Cards View -->
            <div id="membersContainer" class="space-y-3">
                <div class="text-center py-8 text-gray-400">መረጃ በመጫን ላይ ነው...</div>
            </div>
        </div>
    </div>

    <!-- Modal Form -->
    <div id="memberModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-end md:items-center justify-center p-0 md:p-4 z-50">
        <div class="bg-white rounded-t-2xl md:rounded-2xl shadow-2xl max-w-lg w-full p-5 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-800">አዲስ አባል መመዝገቢያ</h3>
                <button onclick="closeModal()" class="text-gray-400 text-2xl font-bold">&times;</button>
            </div>
            <form id="memberForm" onsubmit="saveMember(event)" class="space-y-3">
                <input type="hidden" id="memberId">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">ሙሉ ስም</label>
                    <input type="text" id="inputName" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">ስልክ ቁጥር</label>
                        <input type="tel" id="inputPhone" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">ክፍል</label>
                        <input type="text" id="inputDept" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">ሁኔታ</label>
                        <select id="inputStatus" class="w-full border rounded-lg px-3 py-2 text-sm">
                            <option value="ጀምረዋል">ጀምረዋል</option>
                            <option value="አልጀመሩም">አልጀመሩም</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">ቋሚ ፎርም</label>
                        <select id="inputForm" class="w-full border rounded-lg px-3 py-2 text-sm">
                            <option value="ሞልተዋል">ሞልተዋል</option>
                            <option value="አልሞሉም">አልሞሉም</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">ደዋይ / አስተባባሪ</label>
                    <input type="text" id="inputCaller" class="w-full border rounded-lg px-3 py-2 text-sm">
                </div>
                <div class="flex justify-end gap-2 border-t pt-4 mt-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-2.5 border rounded-xl text-sm font-medium">ሰርዝ</button>
                    <button type="submit" class="px-5 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-medium shadow-md">አስቀምጥ</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // FIREBASE CONFIG WITH REALTIME DATABASE URL
        const firebaseConfig = {
            apiKey: "AIzaSyAUC7UbNJoxzKdD2nB8j4ptl_PfAAGn3w4",
            authDomain: "attendance-app-edbbb.firebaseapp.com",
            databaseURL: "https://attendance-app-edbbb-default-rtdb.firebaseio.com",
            projectId: "attendance-app-edbbb",
            storageBucket: "attendance-app-edbbb.firebasestorage.app",
            messagingSenderId: "594751308584",
            appId: "1:594751308584:web:215994b22038c8b137061d",
            measurementId: "G-1LKVTZ60VP"
        };

        // Initialize Firebase Realtime Database
        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();

        let membersData = [];
        let currentFilterDept = 'all';
        let isAdmin = true;

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('role') === 'caller') {
                isAdmin = false;
                document.getElementById('userRoleBadge').innerText = "ደዋይ";
                document.getElementById('mobileRoleBadge').innerText = "ደዋይ";
            }
            listenToRealtimeUpdates();
        };

        // Realtime Sync
        function listenToRealtimeUpdates() {
            rtdb.ref('members').on('value', (snapshot) => {
                membersData = [];
                const data = snapshot.val();
                if(data) {
                    Object.keys(data).forEach(key => {
                        membersData.push({ id: key, ...data[key] });
                    });
                }
                renderDepartmentButtons();
                filterData();
            });
        }

        function filterData() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = membersData.filter(item => {
                const matchesDept = currentFilterDept === 'all' || item.dept === currentFilterDept;
                const matchesSearch = (item.name || '').toLowerCase().includes(search) || (item.phone || '').includes(search);
                return matchesDept && matchesSearch;
            });
            renderCards(filtered);
            updateMetrics(filtered);
        }

        function renderCards(data) {
            const container = document.getElementById('membersContainer');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-xl text-center text-gray-400 font-medium">ምንም አባል አልተገኘም።</div>`;
                return;
            }

            data.forEach((item) => {
                const statusBadge = item.status === 'ጀምረዋል'
                    ? `<span class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full text-xs font-semibold">ጀምረዋል</span>`
                    : `<span class="bg-rose-100 text-rose-700 px-2 py-0.5 rounded-full text-xs font-semibold">አልጀመሩም</span>`;

                const editBtn = isAdmin 
                    ? `<button onclick="openEditModal('${item.id}')" class="text-blue-600 font-bold text-xs bg-blue-50 px-3 py-1.5 rounded-lg">✏️ ኤዲት</button>`
                    : '';

                container.innerHTML += `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                <h4 class="font-bold text-slate-800 text-base">${item.name}</h4>
                                ${statusBadge}
                            </div>
                            <p class="text-xs text-gray-500">ክፍል፦ ${item.dept || '-'} | ቋሚ ፎርም፦ ${item.form || '-'}</p>
                            <p class="text-xs text-gray-400">ደዋይ፦ ${item.caller || '-'}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <a href="tel:${item.phone}" class="bg-emerald-50 text-emerald-600 p-2.5 rounded-xl font-bold text-sm flex items-center gap-1">
                                📞 ደውል
                            </a>
                            ${editBtn}
                        </div>
                    </div>
                `;
            });
        }

        function updateMetrics(data) {
            document.getElementById('totalCount').innerText = data.length;
            document.getElementById('startedCount').innerText = data.filter(d => d.status === 'ጀምረዋል').length;
            document.getElementById('notStartedCount').innerText = data.filter(d => d.status === 'አልጀመሩም').length;
            document.getElementById('formCount').innerText = data.filter(d => d.form === 'ሞልተዋል').length;
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerText = "አዲስ አባል መመዝገቢያ";
            document.getElementById('memberForm').reset();
            document.getElementById('memberId').value = "";
            document.getElementById('memberModal').classList.remove('hidden');
        }

        function openEditModal(id) {
            if(!isAdmin) return;
            const member = membersData.find(m => m.id === id);
            if(!member) return;

            document.getElementById('modalTitle').innerText = "የአባል መረጃ ኤዲት ማድረጊያ";
            document.getElementById('memberId').value = member.id;
            document.getElementById('inputName').value = member.name || '';
            document.getElementById('inputPhone').value = member.phone || '';
            document.getElementById('inputDept').value = member.dept || '';
            document.getElementById('inputStatus').value = member.status || 'ጀምረዋል';
            document.getElementById('inputForm').value = member.form || 'ሞልተዋል';
            document.getElementById('inputCaller').value = member.caller || '';
            document.getElementById('memberModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('memberModal').classList.add('hidden');
        }

        async function saveMember(e) {
            e.preventDefault();
            const id = document.getElementById('memberId').value;
            const data = {
                name: document.getElementById('inputName').value,
                phone: document.getElementById('inputPhone').value,
                dept: document.getElementById('inputDept').value,
                status: document.getElementById('inputStatus').value,
                form: document.getElementById('inputForm').value,
                caller: document.getElementById('inputCaller').value
            };

            if(id) {
                if(!isAdmin) return;
                await rtdb.ref('members/' + id).update(data);
            } else {
                await rtdb.ref('members').push(data);
            }
            closeModal();
        }

        // Handle Excel File Upload
        function handleFile(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(event) {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                
                batchUploadToFirebase(jsonData);
            };
            reader.readAsArrayBuffer(file);
        }

        function batchUploadToFirebase(data) {
            const updates = {};
            data.forEach(row => {
                const newKey = rtdb.ref().child('members').push().key;
                updates['/members/' + newKey] = {
                    name: row['ስም'] || row['Name'] || '',
                    phone: String(row['ስልክ'] || row['Phone'] || ''),
                    dept: row['ክፍል'] || row['Department'] || 'ያልተመደበ',
                    status: row['ሁኔታ'] || row['Status'] || 'አልጀመሩም',
                    form: row['ፎርም'] || row['Form'] || 'አልሞሉም',
                    caller: row['ደዋይ'] || row['Caller'] || ''
                };
            });
            rtdb.ref().update(updates).then(() => {
                alert("ኤክሴል መረጃው በስኬት ተጭኗል!");
            });
        }

        function renderDepartmentButtons() {
            const depts = [...new Set(membersData.map(m => m.dept).filter(Boolean))];
            const container = document.getElementById('deptButtons');
            container.innerHTML = '';
            depts.forEach(d => {
                container.innerHTML += `
                    <button onclick="setActiveTab('${d}')" class="w-full text-left px-3 py-2 hover:bg-slate-800 rounded-lg text-sm text-slate-300">
                        ${d} (${membersData.filter(m=>m.dept===d).length})
                    </button>
                `;
            });
        }

        function setActiveTab(dept) {
            currentFilterDept = dept;
            filterData();
        }
    </script>
</body>
</html>
