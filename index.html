<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የአባላት መቆጣጠሪያ ዌብሳይት</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 font-sans text-gray-800">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <div class="w-64 bg-slate-900 text-white flex flex-col justify-between p-5 shadow-xl">
            <div>
                <div class="flex items-center gap-3 mb-8">
                    <div class="p-2 bg-blue-600 rounded-lg text-white font-bold text-xl">👥</div>
                    <div>
                        <h1 class="text-lg font-bold tracking-wide">የአባላት ሲስተም</h1>
                        <span id="userRoleBadge" class="text-xs px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 font-medium">አድሚን</span>
                    </div>
                </div>
                <nav class="space-y-2">
                    <button onclick="setActiveTab('all')" id="tab-all" class="w-full text-left px-4 py-3 bg-blue-600 rounded-lg font-medium shadow-md transition-all">
                        📊 ሁሉም አባላት
                    </button>
                    <div class="pt-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">የክፍሎች ዝርዝር</div>
                    <div id="deptButtons" class="space-y-1 max-h-80 overflow-y-auto pr-1">
                        <!-- Department buttons will load here -->
                    </div>
                </nav>
            </div>
            <div class="text-xs text-slate-500 border-t border-slate-800 pt-4">
                © 2026 የአባላት መከታተያ ሲስተም
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 overflow-y-auto p-8">
            <!-- Header -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                <div>
                    <h2 id="pageTitle" class="text-2xl font-bold text-gray-800">የአባላት መከታተያ ዳሽቦርድ</h2>
                    <p class="text-gray-500 text-sm">የአባላት ምደባ፣ ሁኔታ እና ቁጥጥር መድረክ</p>
                </div>
                
                <div class="flex flex-wrap gap-3">
                    <!-- Buttons available for BOTH Admin and Callers -->
                    <button id="addBtn" onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl font-medium shadow-sm transition flex items-center gap-2">
                        ➕ አዲስ አባል መዝግብ
                    </button>
                    <input type="file" id="excelFile" accept=".xlsx, .xls" class="hidden" onchange="handleFile(event)">
                    <button id="uploadBtn" onclick="document.getElementById('excelFile').click()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl font-medium shadow-sm transition flex items-center gap-2">
                        📁 Excel ፋይል ጫን
                    </button>
                    <!-- Share link available for Admin -->
                    <button id="shareLinkBtn" onclick="copyCallerLink()" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2.5 rounded-xl font-medium shadow-sm transition flex items-center gap-2">
                        🔗 የደዋዮች ሊንክ ኮፒ አድርግ
                    </button>
                </div>
            </div>

            <!-- Summary Cards -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <p class="text-gray-500 text-sm font-medium">ጠቅላላ አባላት</p>
                    <h3 id="totalCount" class="text-3xl font-bold text-slate-800 mt-1">0</h3>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <p class="text-gray-500 text-sm font-medium">ሥራ የጀመሩ</p>
                    <h3 id="startedCount" class="text-3xl font-bold text-emerald-600 mt-1">0</h3>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <p class="text-gray-500 text-sm font-medium">ያልጀመሩ</p>
                    <h3 id="notStartedCount" class="text-3xl font-bold text-rose-500 mt-1">0</h3>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <p class="text-gray-500 text-sm font-medium">ቋሚ ፎርም የሞሉ</p>
                    <h3 id="formCount" class="text-3xl font-bold text-blue-600 mt-1">0</h3>
                </div>
            </div>

            <!-- Search and Filter Bar -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6 flex flex-wrap gap-4 justify-between items-center">
                <div class="relative flex-1 max-w-md">
                    <input type="text" id="searchInput" oninput="filterData()" placeholder="በስም ወይም በስልክ ቁጥር ፈልግ..." class="w-full border border-slate-300 rounded-xl px-4 py-2.5 pl-10 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    <span class="absolute left-3 top-3 text-gray-400">🔍</span>
                </div>
                <div class="text-sm text-gray-500 font-medium">
                    የታዩ አባላት፦ <span id="visibleCount" class="text-blue-600 font-bold">0</span>
                </div>
            </div>

            <!-- Table -->
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-slate-200">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-50 text-slate-700 font-bold text-xs uppercase tracking-wider border-b border-slate-200">
                            <tr>
                                <th class="p-4">ተ.ቁ</th>
                                <th class="p-4">ሙሉ ስም</th>
                                <th class="p-4">ስልክ ቁጥር</th>
                                <th class="p-4">የተመደቡበት ክፍል</th>
                                <th class="p-4">ሁኔታ</th>
                                <th class="p-4">ቋሚ ፎርም</th>
                                <th class="p-4">ደዋይ</th>
                                <th class="p-4 text-center action-col">ተግባር (Action)</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-100 text-sm text-slate-600">
                            <tr>
                                <td colspan="8" class="p-8 text-center text-gray-400 font-medium">
                                    እባክዎን ከላይ "Excel ፋይል ጫን" የሚለውን በመጫን የላኩትን ፋይል ያስገቡ።
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Adding/Editing Member -->
    <div id="memberModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 transform transition-all">
            <div class="flex justify-between items-center border-b pb-4 mb-4">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-800">አዲስ አባል መመዝገቢያ</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>
            <form id="memberForm" onsubmit="saveMember(event)" class="space-y-4">
                <input type="hidden" id="memberId">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">ሙሉ ስም</label>
                    <input type="text" id="inputName" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">ስልክ ቁጥር</label>
                        <input type="text" id="inputPhone" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">የተመደቡበት ክፍል</label>
                        <input type="text" id="inputDept" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="ምሳሌ፦ ግቢ ጉባዔ">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">ሁኔታ (Status)</label>
                        <select id="inputStatus" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="ጀምረዋል">ጀምረዋል</option>
                            <option value="አልጀመሩም">አልጀመሩም</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">ቋሚ ፎርም</label>
                        <select id="inputForm" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="ሞልተዋል">ሞልተዋል</option>
                            <option value="አልሞሉም">አልሞሉም</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">ደዋይ / አስተባባሪ</label>
                    <input type="text" id="inputCaller" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="flex justify-end gap-3 border-t pt-4 mt-6">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-lg text-sm font-medium hover:bg-gray-50">ሰርዝ</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 shadow-md">መዝግብ/አስቀምጥ</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let membersData = [];
        let currentFilterDept = 'all';
        let isAdmin = true;

        // Determine user role based on URL parameter (?role=caller)
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const role = urlParams.get('role');
            
            if (role === 'caller') {
                isAdmin = false;
                document.getElementById('userRoleBadge').innerText = "ደዋይ (ተከታታይ)";
                document.getElementById('userRoleBadge').className = "text-xs px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 font-medium";
                
                // Hide share link button for callers
                document.getElementById('shareLinkBtn').classList.add('hidden');
            }
        };

        function copyCallerLink() {
            const baseUrl = window.location.href.split('?')[0];
            const callerUrl = `${baseUrl}?role=caller`;
            navigator.clipboard.writeText(callerUrl);
            alert("🔗 የደዋዮች ሊንክ ኮፒ ተደርጓል!\n\nይህንን ሊንክ ለደዋዮች መላክ ትችላለህ፦\n" + callerUrl);
        }

        function handleFile(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                
                membersData = [];
                const sheet = workbook.Sheets['All'] || workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(sheet, {header: 1});

                let autoId = 1;
                jsonData.forEach((row) => {
                    if (row[2] && row[2] !== 'members name' && row[2] !== 'management folloup sheet') {
                        membersData.push({
                            id: autoId++,
                            name: String(row[2]).trim(),
                            phone: row[3] ? String(row[3]).trim() : '-',
                            dept: row[4] ? String(row[4]).trim() : 'ያልተገለጸ',
                            status: row[6] && String(row[6]).includes('ጀምረዋል') ? 'ጀምረዋል' : 'አልጀመሩም',
                            form: row[10] && String(row[10]).includes('ሞልተዋል') ? 'ሞልተዋል' : 'አልሞሉም',
                            caller: row[12] ? String(row[12]).trim() : '-'
                        });
                    }
                });

                renderDepartmentButtons();
                setActiveTab('all');
            };
            reader.readAsArrayBuffer(file);
        }

        function renderDepartmentButtons() {
            const depts = [...new Set(membersData.map(m => m.dept).filter(Boolean))];
            const container = document.getElementById('deptButtons');
            container.innerHTML = '';

            depts.forEach(d => {
                container.innerHTML += `
                    <button onclick="setActiveTab('${d}')" id="tab-${d}" class="w-full text-left px-3 py-2 hover:bg-slate-800 rounded-lg text-sm text-slate-300 transition-all flex justify-between items-center">
                        <span class="truncate">${d}</span>
                        <span class="bg-slate-800 text-xs px-2 py-0.5 rounded-full text-slate-400">${membersData.filter(m=>m.dept===d).length}</span>
                    </button>
                `;
            });
        }

        function setActiveTab(dept) {
            currentFilterDept = dept;
            document.querySelectorAll('#deptButtons button, #tab-all').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'shadow-md');
                btn.classList.add('text-slate-300');
            });

            const activeBtn = document.getElementById(dept === 'all' ? 'tab-all' : `tab-${dept}`);
            if(activeBtn) {
                activeBtn.classList.add('bg-blue-600', 'text-white', 'shadow-md');
                activeBtn.classList.remove('text-slate-300');
            }

            document.getElementById('pageTitle').innerText = dept === 'all' ? 'የአባላት መከታተያ ዳሽቦርድ' : `ክፍል፦ ${dept}`;
            filterData();
        }

        function filterData() {
            const search = document.getElementById('searchInput').value.toLowerCase();

            const filtered = membersData.filter(item => {
                const matchesDept = currentFilterDept === 'all' || item.dept === currentFilterDept;
                const matchesSearch = item.name.toLowerCase().includes(search) || item.phone.includes(search);
                return matchesDept && matchesSearch;
            });

            renderTable(filtered);
            updateMetrics(filtered);
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            // Toggle Edit column visibility based on role
            document.querySelectorAll('.action-col').forEach(el => {
                el.style.display = isAdmin ? 'table-cell' : 'none';
            });

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-gray-400 font-medium">ምንም አባል አልተገኘም።</td></tr>`;
                return;
            }

            data.forEach((item, index) => {
                const statusBadge = item.status === 'ጀምረዋል' 
                    ? `<span class="bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-full text-xs font-semibold">ጀምረዋል</span>`
                    : `<span class="bg-rose-100 text-rose-700 px-2.5 py-1 rounded-full text-xs font-semibold">አልጀመሩም</span>`;

                const formBadge = item.form === 'ሞልተዋል'
                    ? `<span class="text-blue-600 font-medium">✓ ሞልተዋል</span>`
                    : `<span class="text-gray-400">✕ አልሞሉም</span>`;

                // Only Admin gets the Edit button in table rows
                const actionTd = isAdmin 
                    ? `<td class="p-4 text-center action-col">
                        <button onclick="openEditModal(${item.id})" class="text-blue-600 hover:text-blue-800 font-semibold px-2 py-1 rounded hover:bg-blue-50 transition">
                            ✏️ ኤዲት
                        </button>
                      </td>`
                    : '';

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-4 font-medium text-gray-500">${index + 1}</td>
                        <td class="p-4 font-bold text-slate-800">${item.name}</td>
                        <td class="p-4 font-mono text-gray-600">
                            <a href="tel:${item.phone}" class="text-blue-600 hover:underline">📞 ${item.phone}</a>
                        </td>
                        <td class="p-4">${item.dept}</td>
                        <td class="p-4">${statusBadge}</td>
                        <td class="p-4">${formBadge}</td>
                        <td class="p-4">${item.caller}</td>
                        ${actionTd}
                    </tr>
                `;
            });
        }

        function updateMetrics(data) {
            document.getElementById('totalCount').innerText = data.length;
            document.getElementById('startedCount').innerText = data.filter(d => d.status === 'ጀምረዋል').length;
            document.getElementById('notStartedCount').innerText = data.filter(d => d.status === 'አልጀመሩም').length;
            document.getElementById('formCount').innerText = data.filter(d => d.form === 'ሞልተዋል').length;
            document.getElementById('visibleCount').innerText = data.length;
        }

        // --- Modal Logic ---
        function openAddModal() {
            document.getElementById('modalTitle').innerText = "አዲስ አባል መመዝገቢያ";
            document.getElementById('memberForm').reset();
            document.getElementById('memberId').value = "";
            document.getElementById('memberModal').classList.remove('hidden');
        }

        function openEditModal(id) {
            if(!isAdmin) return; // Block caller edit attempts
            const member = membersData.find(m => m.id === id);
            if(!member) return;

            document.getElementById('modalTitle').innerText = "የአባል መረጃ ማስተካከያ (Edit)";
            document.getElementById('memberId').value = member.id;
            document.getElementById('inputName').value = member.name;
            document.getElementById('inputPhone').value = member.phone;
            document.getElementById('inputDept').value = member.dept;
            document.getElementById('inputStatus').value = member.status;
            document.getElementById('inputForm').value = member.form;
            document.getElementById('inputCaller').value = member.caller;

            document.getElementById('memberModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('memberModal').classList.add('hidden');
        }

        function saveMember(e) {
            e.preventDefault();

            const id = document.getElementById('memberId').value;
            const name = document.getElementById('inputName').value;
            const phone = document.getElementById('inputPhone').value;
            const dept = document.getElementById('inputDept').value;
            const status = document.getElementById('inputStatus').value;
            const form = document.getElementById('inputForm').value;
            const caller = document.getElementById('inputCaller').value;

            if(id) {
                // Edit existing (Admin only)
                if(!isAdmin) return;
                const index = membersData.findIndex(m => m.id == id);
                if(index !== -1) {
                    membersData[index] = { id: Number(id), name, phone, dept, status, form, caller };
                }
            } else {
                // Add new member (Allowed for BOTH Admin and Callers)
                const newMember = {
                    id: Date.now(),
                    name, phone, dept, status, form, caller
                };
                membersData.push(newMember);
            }

            renderDepartmentButtons();
            filterData();
            closeModal();
        }
    </script>
</body>
</html>
